name: UD01Sesion11Laboratorio

services:
  namenode:
    image: apache/hadoop:3.4.0
    container_name: lab-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # NameNode Web UI
      - "8020:8020"
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.replication: "1"
    volumes:
      - ./datos:/workspace
    networks: [lab]

  datanode:
    image: apache/hadoop:3.4.0
    container_name: lab-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "namenode:8020"
      HDFS-SITE.XML_dfs.replication: "1"
    networks: [lab]

  resourcemanager:
    image: apache/hadoop:3.4.0
    container_name: lab-resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"   # YARN ResourceManager Web UI
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      YARN-SITE.XML_yarn.resourcemanager.hostname: "resourcemanager"
      YARN-SITE.XML_yarn.nodemanager.aux-services: "mapreduce_shuffle"
    networks: [lab]

  nodemanager:
    image: apache/hadoop:3.4.0
    container_name: lab-nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on: [resourcemanager]
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:8020"
      YARN-SITE.XML_yarn.resourcemanager.hostname: "resourcemanager"
      YARN-SITE.XML_yarn.nodemanager.aux-services: "mapreduce_shuffle"
    networks: [lab]

networks:
  lab:
    driver: bridge